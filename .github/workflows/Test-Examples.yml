name: Test-Examples
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '00 20 * * 6'

jobs:
  Test-Examples:
    strategy:
      fail-fast: false
      matrix:
        compiler: [AC6, GCC]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout CMSIS-mbedTLS
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Get generated sources from artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./get_artifacts.sh

      - name: Cache packs
        uses: actions/cache@v6
        with:
          key: cmsis-packs-${{ github.workflow }}-${{ hashFiles('**/*.csolution.yml', '**/*.cproject.yml', '**/*.clayer.yml') }}
          restore-keys: |
            cmsis-packs-${{ github.workflow }}-
            cmsis-packs-
          path: /home/runner/.cache/arm/packs

      - name: Activate vcpkg env
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: ./MDK/examples/vcpkg-configuration.json

      - name: Initialize CMSIS pack root folder
        run: |
          cpackget init https://www.keil.com/pack/index.pidx
          cpackget update-index

      - name: Use local CMSIS-mbedTLS pack
        run: |
          cpackget add ARM.mbedTLS.pdsc

      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Build examples
        working-directory: ./MDK/examples
        run: |
          cbuild examples.csolution.yml --packs --toolchain ${{ matrix.compiler }}

      - name: Run SSL Server/Client
        working-directory: ./MDK/examples
        run: |
          echo "Starting SSL Server..."
          FVP_Corstone_SSE-300 -f Board/Corstone-300/fvp_config.txt out/ssl_server/Simulator/Release/ssl_server.hex --timelimit 60 > ssl_server.log 2>&1 &
          server_pid=$!

          for i in {1..10}; do
            if ss -ltn state listening | grep -q ":4433"; then
              echo "Server is listening."
              break
            fi
            sleep 1
          done

          echo "Starting SSL Client..."
          FVP_Corstone_SSE-300 -f Board/Corstone-300/fvp_config.txt out/ssl_client1/Simulator/Release/ssl_client1.hex --timelimit 60 > ssl_client.log 2>&1 &
          client_pid=$!

          for i in {1..10}; do
            if ss -tn state established | grep -q ":4433"; then
              echo "Client connected."
              break
            fi
            sleep 1
          done

          for i in {1..30}; do
            if ! ss -tn state established | grep -q ":4433"; then
              echo "Client disconnected."
              break
            fi
            sleep 1
          done

          echo "Stopping SSL Server..."
          if [ -n "${server_pid:-}" ]; then
            kill "${server_pid}" 2>/dev/null || true
            timeout 10s tail --pid="${server_pid}" -f /dev/null 2>/dev/null || true
            if kill -0 "${server_pid}" 2>/dev/null; then
              kill -9 "${server_pid}" 2>/dev/null || true
              timeout 5s tail --pid="${server_pid}" -f /dev/null 2>/dev/null || true
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              wait "${server_pid}" 2>/dev/null || true
            fi
          fi

          echo "Stopping SSL Client..."
          if [ -n "${client_pid:-}" ]; then
            kill "${client_pid}" 2>/dev/null || true
            timeout 10s tail --pid="${client_pid}" -f /dev/null 2>/dev/null || true
            if kill -0 "${client_pid}" 2>/dev/null; then
              kill -9 "${client_pid}" 2>/dev/null || true
              timeout 5s tail --pid="${client_pid}" -f /dev/null 2>/dev/null || true
            fi
            if ! kill -0 "${client_pid}" 2>/dev/null; then
              wait "${client_pid}" 2>/dev/null || true
            fi
          fi

          echo "SSL Server Log:"
          cat ssl_server.log
          echo "SSL Client Log:"
          cat ssl_client.log

      - name: Analyze logs
        working-directory: ./MDK/examples
        run: |
          echo "Analyzing logs for expected output..."
          grep -Fq -- "Waiting for a remote connection ... ok" ssl_server.log
          grep -Fq -- "Performing the SSL/TLS handshake... ok" ssl_server.log
          grep -Fq -- "Successful connection" ssl_server.log
          grep -Fq -- "Connecting to tcp/localhost/4433... ok" ssl_client.log
          grep -Fq -- "Performing the SSL/TLS handshake... ok" ssl_client.log
          grep -Fq -- "Verifying peer X.509 certificate... ok" ssl_client.log
          grep -Fq -- "Successful connection" ssl_client.log
