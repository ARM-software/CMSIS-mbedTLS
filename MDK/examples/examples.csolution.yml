# A solution is a collection of related projects that share same base configuration.
solution:
  description: Mbed TLS Reference Examples
  created-for: CMSIS-Toolbox@2.13.0
  cdefault:

  # List of tested compilers that can be selected
  select-compiler:
    - compiler: AC6
    - compiler: GCC
    - compiler: IAR
    - compiler: CLANG

  compiler: AC6

  # List of miscellaneous tool-specific controls
  misc:
    - for-compiler: AC6 # GDB requires DWARF 5, remove when using uVision Debugger
      C-CPP:
        - -gdwarf-5
      ASM:
        - -gdwarf-5

  # List the packs that define the device and/or board.
  packs:
    - pack: MDK-Packs::IoT_Socket@^1.4.0
    - pack: ARM::V2M_MPS3_SSE_300_BSP@1.5.0
  # Add BSP pack to use a physical board
  #   - pack: <BSP or DFP>.pack

  # List different hardware targets that are used to deploy the solution.
  target-types:
    # This target is an AVH-FVP simulation model that does not require hardware
    - type: Simulator
      board: ARM::V2M-MPS3-SSE-300-FVP
      variables:
        - Board-Layer: $SolutionDir()$/Board/Corstone-300/Board.clayer.yml
        - Shield-Layer: ""
        - Socket-Layer: $SolutionDir()$/Socket/VSocket/Socket.clayer.yml
      target-set:
        - set:
          images:
            - project-context: ssl_client1.Debug
            - project-context: ssl_server.Debug
          debugger:
            name: Arm-FVP
            model: FVP_Corstone_SSE-300
            config-file: Board/Corstone-300/fvp_config.txt
    # Add a target hardware to use the example on physical hardware 
    # - type: MyBoard
    #   board: <board name>
    #   variables:
    #     - Board-Layer: ""
    #     - Shield-Layer: ""
    #     - Socket-Layer: ""

  # List of different build configurations.
  build-types:
    - type: Debug
      debug: on
      optimize: none

    - type: Release
      debug: off
      optimize: balanced

  # List related projects.
  projects:
    - project: ssl_client1/ssl_client1.cproject.yml
    - project: ssl_server/ssl_server.cproject.yml
