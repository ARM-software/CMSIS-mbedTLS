# A project translates into one executable or library.
project:

  connections:
    - connect: SSL Server
      provides:
        - CMSIS-RTOS2
      consumes:
        - IoT_Socket
        - STDOUT

  packs:
    - pack: ARM::mbedTLS@^4.0.0
    - pack: ARM::CMSIS-RTX@^5.9.1

  define:
    - MBEDTLS_CONFIG_FILE: \"app_mbedtls_config.h\"
    - TF_PSA_CRYPTO_CONFIG_FILE: \"app_crypto_config.h\"

  add-path:
    - ../tests/include

  groups:
    - group: Documentation
      files:
        - file: README.md
    - group: Source Files
      files:
        - file: app_main.c
        - file: app_mbedtls_config.h
        - file: app_crypto_config.h
        - file: ssl_server.c
        - file: ../tests/src/certs.c

  components:
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS:RTOS2:Keil RTX5&Source
    - component: Security:mbed TLS

  layers:
    - layer: $Socket-Layer$
      type: Socket
    - layer: $Shield-Layer$
      type: Shield
    - layer: $Board-Layer$
      type: Board

  output:
    type:
      - elf
      - hex
      - map
